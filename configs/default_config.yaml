independent_first_frame: false
warp_denoising_step: false
weight_decay: 0.01
same_step_across_blocks: true
last_step_only: false
i2v: false
num_training_frames: 21
gc_interval: 100
context_noise: 0
causal: true
max_grad_norm_generator: 10.0
max_grad_norm_critic: 10.0
wandb_host: https://api.wandb.ai
wandb_key: ${oc.env:WANDB_API_KEY,null}
wandb_entity: ${oc.env:WANDB_ENTITY,null}
wandb_project: ${oc.env:WANDB_PROJECT,rmd}
